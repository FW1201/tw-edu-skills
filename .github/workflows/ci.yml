name: Skills validation
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CJK fonts on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/sync_assets.py --check
      - run: python scripts/validate_skills.py
      - run: python scripts/verify_curriculum_snapshot.py
      - run: python -m pytest -q
      - run: python scripts/package_skills.py
      - uses: actions/upload-artifact@v4
        with:
          name: skills-${{ matrix.os }}-${{ matrix.python }}
          path: dist/
